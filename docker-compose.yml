version: '3'
services:
#mssql docker
  erestoran-sql:
    image: mcr.microsoft.com/mssql/server:2017-latest-ubuntu
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=QWElkj132!
      - MSSQL_PID=Developer
    ports:
      - 1401:1433
    expose:
        - 1433
    networks:
      - erestoran

  erestoran-api:
    restart: unless-stopped
    build:
      context: .
    environment:
      - ConnectionStrings:DefaultConnection=Server=erestoran-sql,1433;Database=erestoran;User=sa;Password=QWElkj132!;ConnectRetryCount=0
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - 7002:7002
    networks:
      - erestoran
    links:
      - erestoran-sql
    depends_on:
      - erestoran-sql
      
networks:
  erestoran:
    driver: bridge      